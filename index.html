<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人主页</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .hero {
      background: white;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 44px;
      margin: 0 0 12px;
    }

    .subtitle {
      font-size: 20px;
      color: #666;
      margin-bottom: 28px;
    }

    .section {
      background: white;
      margin-top: 24px;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }

    h2 {
      margin-top: 0;
    }

    a {
      color: #0969da;
      text-decoration: none;
    }

    .tag {
      display: inline-block;
      padding: 6px 12px;
      margin: 4px 6px 4px 0;
      border-radius: 999px;
      background: #eef2ff;
      color: #333;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>你好，我是 Pangchuan Wang</h1>
      <p class="subtitle">这里是我的个人主页。</p>
      <p>
        我正在学习做网站、AI 产品和个人项目。这个页面会用来展示我的作品、经历和想法。
      </p>
    </section>

    <section class="section">
      <h2>关于我</h2>
      <p>
        你可以在这里写你的自我介绍，比如你现在在做什么、感兴趣的方向、正在学习的东西。
      </p>
    </section>

    <section class="section">
      <h2>我的项目</h2>
      <ul>
        <li>The Unapplauded：一个 AI 生成表达/叙事相关项目。</li>
        <li>个人主页：使用 GitHub Pages 搭建的静态网站。</li>
      </ul>
    </section>

    <section class="section">
      <h2>技能 / 兴趣</h2>
      <span class="tag">AI</span>
      <span class="tag">Web</span>
      <span class="tag">产品</span>
      <span class="tag">写作</span>
    </section>

    <section class="section">
      <h2>联系我</h2>
      <p>Email：your-email@example.com</p>
      <p>GitHub：<a href="https://github.com/pcw2001">https://github.com/pcw2001</a></p>
    </section>
  </main>
</body>
</html>
